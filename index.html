<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
  <title>Budget</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main screen: built by js/input.js -->
  <main id="view-input"></main>

  <div id="menu-backdrop" class="backdrop">
    <nav id="menu" class="menu">
      <button data-action="current">Current Period</button>
      <button data-action="periods">Past Periods</button>
      <button data-action="categories">Categories</button>
      <button data-action="new-period">New Period</button>
      <button data-action="backup">Backup<small id="backup-status"></small></button>
    </nav>
  </div>

  <!-- Secondary screens: built by js/pages.js -->
  <section id="page" class="page" hidden>
    <header class="topbar">
      <button id="page-back" class="icon-btn" aria-label="Back">‹</button>
      <h1 id="page-title"></h1>
      <span class="icon-btn"></span>
    </header>
    <div id="page-body" class="page-body"></div>
  </section>

  <div id="sheet-backdrop" class="backdrop">
    <div id="sheet" class="sheet"></div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
