<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bgt-J">
  <meta name="theme-color" content="#000000">
  <title>Bgt-J</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Black from the very first frame, before the stylesheet arrives. -->
  <style>html, body { background: #000; }</style>
  <link rel="stylesheet" href="style.css">
</head>
<body class="starting">
  <!-- Top of every screen, for reading: the HELP window (which also shows messages) and, on
       screens other than the main one, the title window with the screen's name. -->
  <header class="hud">
    <div id="help" class="window help" data-label="Help" role="status"></div>
    <div id="title" class="window title" hidden></div>
  </header>

  <!-- Bottom of every screen, under the thumb: Undo (while a message offers it) and the
       Menu button, which is Back on screens other than the main one. -->
  <footer class="dock">
    <button id="undo-btn" class="window undo-btn" hidden>Undo</button>
    <button id="nav-btn" class="window nav-btn">Menu</button>
  </footer>

  <!-- Main screen: built by js/input.js -->
  <main id="view-input"></main>

  <!-- Secondary screens: built by js/pages.js -->
  <section id="page" class="page" hidden>
    <div id="page-body" class="page-body"></div>
  </section>

  <div id="menu-backdrop" class="backdrop">
    <!-- Opens upward from the Menu button. Grouped by subject (periods, then setup), most used
         nearest the thumb at the bottom. -->
    <nav id="menu" class="menu">
      <div class="window menu-stats">
        <div><span class="label">Day</span><span id="stat-day"></span></div>
        <div><span id="stat-left-label" class="label">Left</span><span id="stat-left"></span></div>
        <div><span class="label">Backup</span><span id="backup-status"></span></div>
      </div>
      <div class="window menu-list">
        <button data-action="backup">Backup</button>
        <button data-action="categories">Categories</button>
        <button data-action="new-period">New Period</button>
        <button data-action="periods">Past Periods</button>
        <button data-action="current">Current Period</button>
      </div>
    </nav>
  </div>

  <div id="sheet-backdrop" class="backdrop">
    <div id="sheet" class="window sheet"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
