<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bgt-J">
  <meta name="theme-color" content="#000000">
  <title>Bgt-J</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <!-- Launch screens: plain black while iOS starts the app, one per iPhone screen size
       (tests/tools/make-splash.js). -->
  <link rel="apple-touch-startup-image" href="icons/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="preload" href="fonts/barlow-semi-condensed-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-semi-condensed-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Before the stylesheet arrives: black from the very first frame, and nothing shown until
       app.js has built every screen, then it all appears at once (a short fade). If the app never
       starts, the page shows anyway after 2.5s rather than staying black. -->
  <style>
    html, body { background: #000; }
    body { transition: opacity 0.1s ease-out; }
    body.starting { opacity: 0; animation: show-anyway 0s 2.5s forwards; }
    @keyframes show-anyway { to { opacity: 1; } }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body class="starting">
  <!-- Top of every screen, for reading: the HELP window (which also shows messages) and, on
       screens other than the main one, the title window with the screen's name. -->
  <header class="hud">
    <div id="help" class="window help" data-label="Help" role="status"></div>
    <div id="title" class="window title" hidden></div>
  </header>

  <!-- Bottom of every screen, under the thumb: Undo (while a message offers it) and the
       Menu button, which is Back on screens other than the main one. -->
  <footer class="dock">
    <button id="undo-btn" class="window undo-btn" hidden>Undo</button>
    <button id="nav-btn" class="window nav-btn">Menu</button>
  </footer>

  <!-- Main screen: built by js/input.js -->
  <main id="view-input"></main>

  <!-- Secondary screens: built by js/pages.js -->
  <section id="page" class="page" hidden>
    <div id="page-body" class="page-body"></div>
  </section>

  <div id="menu-backdrop" class="backdrop">
    <!-- Opens upward from the Menu button. Grouped by subject (periods, then setup), most used
         nearest the thumb at the bottom. -->
    <nav id="menu" class="menu">
      <div class="window menu-stats">
        <div><span class="label">Day</span><span id="stat-day"></span></div>
        <div><span id="stat-left-label" class="label">Left</span><span id="stat-left"></span></div>
        <div><span class="label">Backup</span><span id="backup-status"></span></div>
      </div>
      <div class="window menu-list">
        <button data-action="backup">Backup</button>
        <button data-action="categories">Categories</button>
        <button data-action="new-period">New Period</button>
        <button data-action="periods">Past Periods</button>
        <button data-action="current">Current Period</button>
      </div>
    </nav>
  </div>

  <div id="sheet-backdrop" class="backdrop">
    <div id="sheet" class="window sheet"></div>
  </div>

  <!-- Shown instead of everything else while the phone is sideways (see style.css). -->
  <div class="turn-upright" role="alert">
    <div class="window" data-label="Help">Turn your phone upright to use Bgt-J.</div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
